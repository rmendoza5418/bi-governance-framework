name: Docs check

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Every folder has a README and no file is empty
        run: |
          test -f README.md
          for d in certification-standards naming-conventions onboarding performance-guidelines project-structure; do
            test -s "$d/README.md" || { echo "Missing or empty $d/README.md"; exit 1; }
          done
          find . -name '*.md' -not -path './.git/*' -empty -print -exec false {} +
